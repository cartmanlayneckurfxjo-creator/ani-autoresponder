name: ANI Instagram Autoresponder 24/7

on:
  schedule:
    # Runs every 10 minutes automatically
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  autorespond:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Autoresponder
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python gha_runner.py

      - name: Commit and Push Processed Comments
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_comments.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update processed comments cache [skip ci]" && git push)
